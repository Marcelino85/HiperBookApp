<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Momento com Deus</title>
</head>
<body>
  <h1>Momento com Deus</h1>
  <button onclick="gerar()">Gerar Meditação</button>

  <pre id="saida"></pre>

  <script>
    async function gerar() {
      const res = await fetch("/.netlify/functions/meditation");
      const text = await res.text();

      document.getElementById("saida").innerText = text;
    }
  </script>
</body>
</html>
